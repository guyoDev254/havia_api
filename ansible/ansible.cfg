[defaults]
inventory = inventory/hosts.yml
host_key_checking = False
remote_user = root
roles_path = roles
retry_files_enabled = False
stdout_callback = yaml
gathering = smart
fact_caching = memory

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True

