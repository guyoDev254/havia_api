services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: havia-api
    restart: unless-stopped
    expose:
      - "6000"
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
    networks:
      - havia-network
    # Entrypoint script handles migrations automatically
    # You can disable migrations by setting RUN_MIGRATIONS=false
    environment:
      - RUN_MIGRATIONS=true

volumes:
  uploads_data:

networks:
  havia-network:
    driver: bridge
